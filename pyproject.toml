[project]
name = "comp-vs-like"
version = "1.0.0"
description = "Compression vs. likelihood: disentangling tokeniser objective from search procedure"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.6.0,<2.7.0",
    "transformers>=4.48.0",
    "lightning>=2.5.0",
    "datasets>=3.0.0",
    "tokenizers>=0.21.0",
    "polars>=1.25.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0",
    "typer>=0.15.0",
    "rich>=13.6.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",
    "tensorboard>=2.17.0",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.7.0"]
figures = ["matplotlib>=3.8.0", "venn>=0.1.3"]
ablations = ["sentencepiece>=0.2.0"]   # SentencePiece-seeded tokenisers only
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
cache-dir = "./.uv_cache"
no-build-isolation-package = ["flash-attn"]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["tokenizer_training/fork"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
