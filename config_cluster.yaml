# Cluster configuration for ETH Obsession

# Paths
paths:
  tokenizer: /local/home/ayavuz/data_all/tokenizers/bpe-32k
  train_data: /local/home/ayavuz/data_all/data/fineweb-edu-bpe-32k/train
  val_data: /local/home/ayavuz/data_all/data/fineweb-edu-bpe-32k/val
  test_data: /local/home/ayavuz/data_all/data/fineweb-edu-bpe-32k/test
  output_dir: /local/home/ayavuz/outputs

# Model configuration
model:
  config_path: configs/models/me57M-tied.yaml
  use_flash_attention: true
  use_liger_kernel: false
  torch_compile: false

# Training
training:
  seed: 42
  max_steps: 50000
  batch_size: 8
  gradient_accumulation: 1
  sequence_length: 2048

  # Optimizer
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0

  # Scheduler (warmup-stable-decay)
  warmup_steps: 2000
  decay_steps: 10000
  min_lr_ratio: 0.1

  # Regularization
  z_loss_weight: 1.0e-4

# Checkpointing
checkpoint:
  save_every_n_steps: 5000
  save_dir: .checkpoints
  save_last: true
  save_top_k: 3

# Hardware
hardware:
  accelerator: gpu
  devices: auto
  precision: bf16-mixed
  strategy: auto

# Logging
logging:
  log_every_n_steps: 50
  val_check_interval: 1000
